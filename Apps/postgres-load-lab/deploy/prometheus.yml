global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: loadlab-app
    static_configs:
      - targets: ["127.0.0.1:8080"]
  - job_name: loadlab-node
    static_configs:
      - targets: ["127.0.0.1:9100"]
  - job_name: loadlab-postgres
    static_configs:
      - targets: ["127.0.0.1:9187"]
